name: testing for PR

on:
  pull_request:

jobs:
  build:
    name: testing PR build
    runs-on: arc-runner-set

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v3
        with:
          stable: "false"
          go-version: "1.18"

      - name: Go version check
        run: go version

      - name: Generate aquasec-com App token
        id: aquasec_com_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.AQUASEC_COM_CI_READER_APP_ID }}
          private-key: ${{ secrets.AQUASEC_COM_CI_READER_PRIVATE_KEY }}
          owner: aquasec-com

      - name: Generate argonsecurity App token
        id: argon_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.ARGON_CI_READER_APP_ID }}
          private-key: ${{ secrets.ARGON_CI_READER_PRIVATE_KEY }}
          owner: argonsecurity

      - name: Configure git url
        run: |
          git config --global url.https://x-access-token:${{ steps.argon_token.outputs.token }}@github.com/argonsecurity/.insteadOf https://github.com/argonsecurity/
          git config --global url.https://x-access-token:${{ steps.aquasec_com_token.outputs.token }}@github.com/aquasec-com/.insteadOf https://github.com/aquasec-com/

      - name: Run tests
        env:
          GOPRIVATE: github.com/argonsecurity/*,github.com/aquasec-com/*
          CGO_ENABLED: 0  # Disables CGO to bypass the requirement for gcc
        run: go test -v ./...

      - name: Remove auth from git config
        if: always()
        run: |
          set +e
          git config --global --get-regexp '^url\.' 2>/dev/null > /tmp/git_urls.txt
          grep -E '(github\.com|bitbucket\.org)' /tmp/git_urls.txt > /tmp/matched.txt || true
          while read -r key _; do
            [ -n "$key" ] && git config --global --unset-all "$key" || true
          done < /tmp/matched.txt
          exit 0
